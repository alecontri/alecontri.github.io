---
layout: default
---
<article>
  <header class="page-header">
    <div class="wrapper">
      {%- if page.eyebrow -%}<p class="eyebrow">{{ page.eyebrow }}</p>{%- endif -%}
      <h1>{{ page.title | escape }}</h1>
    </div>
  </header>

  <div class="page-content">
    <div class="wrapper">
      {%- if page.back_url -%}
        <a class="back-link" href="{{ page.back_url | relative_url }}">← {{ page.back_label | default: "Back" }}</a>
      {%- endif -%}
      {{ content }}
    </div>
  </div>
</article>
